# Prinny webapp — drop-in nginx config.
#
# Adapt server_name (and add ssl/listen 443 directives) for your deployment.
# Symlink into /etc/nginx/sites-enabled/ or include from your main config.
#
# IMPORTANT: `root` must point at a directory that does NOT contain the git
# working tree of this branch. The recommended layout (see README.md) is:
#
#   /usr/share/webapps/prinny            <- git clone of webapp-release (.git!)
#   /usr/share/webapps/prinny/dist       <- docroot, no dotfiles, no .git
#
# The dotfile deny rule below is a second line of defence, not the first one.

server {
  listen 80;
  listen [::]:80;
  server_name prinny.example;

  root /usr/share/webapps/prinny/dist;
  index index.html;

  # ---------------------------------------------------------------------
  # Security headers.
  #
  # This client renders untrusted third-party HTML (room messages), so the
  # CSP is the compensating control if the sanitiser is ever bypassed.
  #
  # Why each source is present:
  #   script-src   'self'                only bundled, same-origin scripts;
  #                                      index.html has no inline script.
  #                'wasm-unsafe-eval'    matrix-sdk-crypto-wasm (E2EE) and
  #                                      Element Call instantiate WebAssembly.
  #                'sha256-...' x2       the two inline scripts inside the
  #                                      vendored Element Call iframe document
  #                                      (public/element-call/index.html).
  #                google/gstatic        react-google-recaptcha loads
  #                                      recaptcha/api.js during registration.
  #                js.hcaptcha.com       some homeservers run hCaptcha behind
  #                newassets.hcaptcha.com the m.login.recaptcha stage; its
  #                                      widget is loaded on demand.
  #   connect-src  https: wss:           arbitrary user-chosen homeservers.
  #   img/media    https: blob: data:    homeserver media + decrypted blobs.
  #   style-src    'unsafe-inline'       React/vanilla-extract inline styles.
  #   worker-src   blob:                 pdf.js and LiveKit E2EE workers.
  #   frame-src    https:                URL-preview embeds + reCAPTCHA frame.
  #
  # nginx does NOT inherit add_header into a location that defines its own,
  # which is why the security headers are repeated in every location below
  # that sets a Cache-Control header. Keep them in sync.
  #
  # Regenerate the Element Call hashes after an upstream bump of
  # @element-hq/element-call-embedded:
  #   python3 - <<'EOF'
  #   import re,hashlib,base64
  #   h=open('public/element-call/index.html',encoding='utf-8').read()
  #   for m in re.finditer(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',h,re.S):
  #       print('sha256-'+base64.b64encode(hashlib.sha256(m.group(1).encode()).digest()).decode())
  #   EOF
  # ---------------------------------------------------------------------
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-pQY0fuQAnnVQH5nQfjo80rzGkQzeN3JeAtAJ+1KcD4k=' 'sha256-3042zLa3JXvrJe/2n8P/XpIKwqBdNTu7fwbLZUNrzZQ=' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://recaptcha.net/recaptcha/ https://js.hcaptcha.com/ https://newassets.hcaptcha.com/; style-src 'self' 'unsafe-inline'; img-src 'self' https: blob: data:; media-src 'self' https: blob: data:; font-src 'self' data:; connect-src 'self' https: wss: blob: data:; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' https:; manifest-src 'self'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "accelerometer=(), browsing-topics=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), local-fonts=(), magnetometer=(), midi=(), payment=(), serial=(), usb=(), xr-spatial-tracking=()" always;
  # Uncomment on the TLS vhost (never on plain HTTP):
  # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  # Never serve dotfiles: .git/**, .env, editor droppings. This matters most if
  # you ignored the advice above and pointed `root` at the git working tree —
  # without it, /.git/config and the whole object store are world-readable.
  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
  }

  # Deployment metadata that ships in the branch but must not be served.
  location ~ ^/(nginx\.conf|README\.md|checksums\.sha256)$ {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
  }

  # Long cache for fingerprinted asset bundles.
  location ^~ /assets/ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-pQY0fuQAnnVQH5nQfjo80rzGkQzeN3JeAtAJ+1KcD4k=' 'sha256-3042zLa3JXvrJe/2n8P/XpIKwqBdNTu7fwbLZUNrzZQ=' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://recaptcha.net/recaptcha/ https://js.hcaptcha.com/ https://newassets.hcaptcha.com/; style-src 'self' 'unsafe-inline'; img-src 'self' https: blob: data:; media-src 'self' https: blob: data:; font-src 'self' data:; connect-src 'self' https: wss: blob: data:; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' https:; manifest-src 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    try_files $uri =404;
  }

  # Public assets (icons, fonts, etc.) — short cache so updates land quickly.
  location ^~ /public/ {
    try_files $uri =404;
  }

  # Service worker must never be cached or update detection breaks.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' https: blob: data:; media-src 'self' https: blob: data:; font-src 'self' data:; connect-src 'self' https: wss: blob: data:; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' https:; manifest-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    expires 0;
    try_files $uri =404;
  }

  # Top-level static files served as-is.
  #
  # /config.json falls back to the shipped sample, which is what makes a fresh
  # clone of this branch run without any setup step: `dist/config.json` is not
  # tracked (see .gitignore) precisely so that `git pull` can never conflict
  # with an operator's edits, so on a new checkout it does not exist yet and
  # `dist/config.sample.json` is the config. Create `dist/config.json` to
  # override it — nginx will then prefer it, and git will continue to ignore it.
  #
  # Order matters: $uri first, sample second. Reversing it would make the
  # sample permanently shadow the operator's own config.
  location = /config.json     { try_files $uri /config.sample.json =404; }
  location = /manifest.json   { try_files $uri =404; }
  location = /pdf.worker.min.js { try_files $uri =404; }

  # The sample is readable on purpose — `try_files` above serves it under
  # /config.json, and an operator fetching it directly to compare against their
  # own config is a reasonable thing to do. It holds nothing secret; it is the
  # same file this repository publishes.
  location = /config.sample.json { try_files $uri =404; }

  # SPA fallback — every other route resolves to index.html so the client router
  # can take over.
  location / {
    try_files $uri /index.html;
  }
}
