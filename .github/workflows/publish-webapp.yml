name: Publish webapp

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-webapp
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: Build dist and publish to webapp-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          path: source

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: source/.node-version
          package-manager-cache: false

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Apply Prinny rebrand
        working-directory: source
        run: node scripts/rebrand.mjs

      # This repository has no release tags of its own — versions are minted by
      # prinny-client's release pipeline, which stamps them into
      # cinny/package.json via scripts/bump-version.mjs. Nothing stamped them
      # here, so both webapp-release and prinny.app/app shipped whatever
      # version happened to be committed (4.11.10) while releases were at
      # 4.11.121, and the About screen reads package.json directly.
      - name: Stamp version from the latest prinny-client release
        working-directory: source
        run: |
          set -euo pipefail
          TAG=$(curl -fsSL https://api.github.com/repos/coffeegrind123/prinny-client/releases/latest \
                | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).tag_name || ""')
          VERSION=${TAG#v}
          if [ -z "$VERSION" ]; then
            echo "::warning::Could not resolve a release tag — leaving the committed version alone"
            exit 0
          fi
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.version = process.argv[1];
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          ' "$VERSION"
          echo "Stamped $VERSION"

      - name: Build
        working-directory: source
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: npm run build

      # The built app goes into a `dist/` subdirectory of the published branch,
      # never the branch root: self-hosters point nginx at the checkout, and a
      # docroot that contains `.git` serves the whole object store publicly.
      # nginx.conf / README.md / checksums.sha256 stay at the root, outside the
      # docroot.
      - name: Stage publish contents
        run: |
          mkdir -p publish/dist
          cp -a source/dist/. publish/dist/
          cp -a source/.github/webapp-release-template/. publish/

      # Integrity manifest for the published artifact: self-hosters `git clone`
      # / `git pull` this branch straight onto a web server, so give them
      # something to verify with (`sha256sum -c checksums.sha256`).
      - name: Generate checksum manifest
        working-directory: publish
        run: |
          find dist -type f -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > checksums.sha256
          echo "Hashed $(wc -l < checksums.sha256) files"

      # GITHUB_OUTPUT is written with the delimiter form: a value containing a
      # newline (or a crafted `name=value` line) in a `key=value` write can
      # inject arbitrary extra outputs.
      - name: Read source metadata
        id: meta
        run: |
          VERSION=$(node -p "require('./source/package.json').version")
          SOURCE_SHORT=$(cd source && git rev-parse --short HEAD)
          {
            echo "version<<__GH_OUTPUT_EOF__"
            echo "$VERSION"
            echo "__GH_OUTPUT_EOF__"
            echo "source_short<<__GH_OUTPUT_EOF__"
            echo "$SOURCE_SHORT"
            echo "__GH_OUTPUT_EOF__"
          } >> "$GITHUB_OUTPUT"

      # The token is passed per-command via `git -c http.extraheader=...`, which
      # git keeps in GIT_CONFIG_PARAMETERS for that invocation only. Embedding
      # it in the remote URL wrote it into release/.git/config, where it stayed
      # readable for the rest of the job (and by every later step and action).
      - name: Prepare webapp-release working tree
        run: |
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)"
          echo "::add-mask::${AUTH_HEADER#AUTHORIZATION: basic }"
          git -c "http.extraheader=${AUTH_HEADER}" \
            clone "https://github.com/${GITHUB_REPOSITORY}.git" release
          cd release
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git -c "http.extraheader=${AUTH_HEADER}" ls-remote --exit-code --heads origin webapp-release > /dev/null; then
            git checkout webapp-release
            # Drop every tracked file so removals propagate (keep .git).
            git ls-files -z | xargs -0r rm -f
            find . -mindepth 1 -type d -empty -not -path './.git*' -delete 2>/dev/null || true
          else
            echo "webapp-release branch missing — creating as orphan"
            git checkout --orphan webapp-release
            git rm -rf . 2>/dev/null || true
          fi
          # Fail loudly if a credential ever ends up on disk again.
          if grep -q "x-access-token" .git/config; then
            echo "::error::token leaked into release/.git/config"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy build into release tree
        run: cp -a publish/. release/

      - name: Commit and push
        working-directory: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed as environment values, not interpolated into the shell:
          # `${{ }}` splices the raw text into the script before bash parses it.
          VERSION: ${{ steps.meta.outputs.version }}
          SOURCE_SHORT: ${{ steps.meta.outputs.source_short }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes vs. previous publish — skipping commit"
            exit 0
          fi
          git commit -m "Build v${VERSION} (source ${SOURCE_SHORT})"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)"
          echo "::add-mask::${AUTH_HEADER#AUTHORIZATION: basic }"
          git -c "http.extraheader=${AUTH_HEADER}" push origin webapp-release

      # ---------------------------------------------------------------------
      # Deploy the same build to https://prinny.app/app/
      #
      # This is a SECOND build, not a copy of the one above: Vite bakes the
      # public base path into every emitted asset URL, and the webapp-release
      # build uses '/' for self-hosters serving from a domain root. Served from
      # a subdirectory, those absolute '/assets/...' URLs would 404. Setting
      # PRINNY_BASE=/app/ re-emits them as '/app/assets/...'.
      #
      # Deep links work without any SPA rewrite because the app runs with
      # hashRouter enabled, so the path is always exactly /app/.
      # ---------------------------------------------------------------------
      # The token check lives inside `run`, not in an `if:`. A step's own
      # step-level `env:` is not in scope for its `if:` expression, so
      # `if: env.DEPLOY_TOKEN != ''` would read as empty and skip forever.
      # Same in-script guard the dispatch step below uses.
      #
      # SPLIT INTO TWO STEPS ON PURPOSE. `npm run build` runs vite, which loads
      # and executes plugin, PostCSS and transform code from node_modules in
      # process. Any of that code can read `process.env`, so a step that holds
      # DEPLOY_TOKEN must not also run the build - a single compromised
      # transitive dependency would otherwise walk off with a Contents:write
      # token for the repository that serves the live site. The build step below
      # carries no secret; the deploy step that follows runs only git.
      - name: Rebuild for prinny.app (no secrets in this step)
        if: success()
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: |
          set -euo pipefail
          PRINNY_BASE=/app/ npm --prefix source run build

      - name: Deploy to prinny.app
        if: success()
        env:
          DEPLOY_TOKEN: ${{ secrets.PRINNY_APP_DEPLOY_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          SOURCE_SHORT: ${{ steps.meta.outputs.source_short }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_TOKEN:-}" ]; then
            echo "::warning::PRINNY_APP_DEPLOY_TOKEN not set — skipping prinny.app/app deploy"
            exit 0
          fi
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${DEPLOY_TOKEN}" | base64 -w0)"
          echo "::add-mask::${AUTH_HEADER#AUTHORIZATION: basic }"
          git -c "http.extraheader=${AUTH_HEADER}" \
            clone --depth 1 https://github.com/coffeegrind123/prinny.app.git site
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if grep -q "x-access-token" .git/config; then
            echo "::error::token leaked into site/.git/config"
            exit 1
          fi
          # Replace the whole directory so deleted assets do not linger.
          rm -rf app
          mkdir -p app
          cp -a ../source/dist/. app/
          git add -A app
          if git diff --cached --quiet; then
            echo "No changes vs. previous deploy — skipping commit"
            exit 0
          fi
          git commit -m "Deploy webapp v${VERSION} (cinny ${SOURCE_SHORT})"
          git -c "http.extraheader=${AUTH_HEADER}" push origin HEAD:main

      # Reactive submodule bump for prinny-client. PAT must have `Contents:
      # write` on coffeegrind123/prinny-client (fine-grained) or `repo` scope
      # (classic). Stored as a secret in this repo. If unset, this step
      # quietly skips so the workflow still passes for the webapp-release
      # publish.
      - name: Notify prinny-client to bump submodule
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PRINNY_CLIENT_DISPATCH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::PRINNY_CLIENT_DISPATCH_TOKEN secret not set — skipping dispatch"
            exit 0
          fi
          gh api repos/coffeegrind123/prinny-client/dispatches \
            -f event_type=cinny-pushed \
            -f "client_payload[sha]=$GITHUB_SHA" \
            -f "client_payload[short]=${GITHUB_SHA:0:8}"
          echo "Dispatched cinny-pushed event with SHA ${GITHUB_SHA:0:8}"
