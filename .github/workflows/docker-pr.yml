name: 'Docker check'

# This is the only thing that validates the Dockerfile. Dependabot watches the
# `docker` ecosystem (see .github/dependabot.yml), so this fires on every base
# image bump it proposes — which is the case that most needs checking, since
# both FROM lines are pinned by digest.
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker-nginx.conf'
      - '.github/workflows/docker-pr.yml'

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read, not write: this job builds with `push: false`, so the ghcr login
      # only needs to pull. Nothing in this repository pushes an image.
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # No Docker Hub login: DOCKER_USERNAME / DOCKER_PASSWORD are not set on
      # this repository, so the step could only ever fail into
      # `continue-on-error`. Base images pull anonymously.
      - name: Login to the Github Container registry #Do not update this action from a outside PR
        if: github.event.pull_request.head.repo.fork == false
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Extract metadata (tags, labels) for Docker, GHCR
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}

      - name: Build Docker image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Show Docker images
        run: docker images
