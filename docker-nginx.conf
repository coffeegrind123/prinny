# nginx vhost for the container image built by ./Dockerfile.
#
# The final image runs as an unprivileged user (UID 101), which cannot bind
# ports below 1024 — hence 8080. Publish it with `docker run -p 80:8080 ...`.
server {
  listen 8080;
  listen [::]:8080;

  # ---------------------------------------------------------------------
  # Security headers.
  #
  # This client renders untrusted third-party HTML (room messages), so the
  # CSP is the compensating control if the sanitiser is ever bypassed.
  #
  # Why each source is present:
  #   script-src   'self'                only bundled, same-origin scripts;
  #                                      index.html has no inline script.
  #                'wasm-unsafe-eval'    matrix-sdk-crypto-wasm (E2EE) and
  #                                      Element Call instantiate WebAssembly.
  #                'sha256-...' x2       the two inline scripts inside the
  #                                      vendored Element Call iframe document
  #                                      (public/element-call/index.html).
  #                google/gstatic        react-google-recaptcha loads
  #                                      recaptcha/api.js during registration.
  #                js.hcaptcha.com       some homeservers run hCaptcha behind
  #                newassets.hcaptcha.com the m.login.recaptcha stage; its widget
  #                                      is loaded on demand by HCaptchaStage.tsx.
  #   connect-src  https: wss:           arbitrary user-chosen homeservers,
  #                                      sliding-sync and LiveKit SFUs.
  #   img/media    https: blob: data:    media from arbitrary homeservers, plus
  #                                      decrypted attachments as blob: URLs.
  #   style-src    'unsafe-inline'       React/vanilla-extract inline styles.
  #   worker-src   blob:                 pdf.js and LiveKit E2EE workers.
  #   frame-src    https:                URL-preview embeds (YouTube/Piped,
  #                                      Bandcamp) and the reCAPTCHA frame.
  #
  # Regenerate the Element Call hashes after bumping
  # @element-hq/element-call-embedded:
  #   python3 - <<'EOF'
  #   import re,hashlib,base64
  #   h=open('dist/public/element-call/index.html',encoding='utf-8').read()
  #   for m in re.finditer(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',h,re.S):
  #       print('sha256-'+base64.b64encode(hashlib.sha256(m.group(1).encode()).digest()).decode())
  #   EOF
  # ---------------------------------------------------------------------
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-pQY0fuQAnnVQH5nQfjo80rzGkQzeN3JeAtAJ+1KcD4k=' 'sha256-3042zLa3JXvrJe/2n8P/XpIKwqBdNTu7fwbLZUNrzZQ=' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://recaptcha.net/recaptcha/ https://js.hcaptcha.com/ https://newassets.hcaptcha.com/; style-src 'self' 'unsafe-inline'; img-src 'self' https: blob: data:; media-src 'self' https: blob: data:; font-src 'self' data:; connect-src 'self' https: wss: blob: data:; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' https:; manifest-src 'self'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "accelerometer=(), browsing-topics=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), local-fonts=(), magnetometer=(), midi=(), payment=(), serial=(), usb=(), xr-spatial-tracking=()" always;
  # No Strict-Transport-Security here: this vhost speaks plain HTTP behind
  # whatever TLS terminator you run in front of the container. Set HSTS there.
  #
  # nginx does NOT inherit add_header into a location that defines its own, so
  # every location below that sets Cache-Control repeats these five headers.
  # Keep all copies in sync, or that location is served without the CSP.

  # Content-hashed bundles never change under the same name: cache them for
  # good. A missing one is a real 404, not the SPA fallback (which would serve
  # HTML as JS).
  location /assets/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-pQY0fuQAnnVQH5nQfjo80rzGkQzeN3JeAtAJ+1KcD4k=' 'sha256-3042zLa3JXvrJe/2n8P/XpIKwqBdNTu7fwbLZUNrzZQ=' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://recaptcha.net/recaptcha/ https://js.hcaptcha.com/ https://newassets.hcaptcha.com/; style-src 'self' 'unsafe-inline'; img-src 'self' https: blob: data:; media-src 'self' https: blob: data:; font-src 'self' data:; connect-src 'self' https: wss: blob: data:; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' https:; manifest-src 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), browsing-topics=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), local-fonts=(), magnetometer=(), midi=(), payment=(), serial=(), usb=(), xr-spatial-tracking=()" always;
    try_files $uri =404;
  }

  # The call widget's own hashed bundles, loaded in the iframe.
  location /public/element-call/assets/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-pQY0fuQAnnVQH5nQfjo80rzGkQzeN3JeAtAJ+1KcD4k=' 'sha256-3042zLa3JXvrJe/2n8P/XpIKwqBdNTu7fwbLZUNrzZQ=' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://recaptcha.net/recaptcha/ https://js.hcaptcha.com/ https://newassets.hcaptcha.com/; style-src 'self' 'unsafe-inline'; img-src 'self' https: blob: data:; media-src 'self' https: blob: data:; font-src 'self' data:; connect-src 'self' https: wss: blob: data:; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' https:; manifest-src 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), browsing-topics=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), local-fonts=(), magnetometer=(), midi=(), payment=(), serial=(), usb=(), xr-spatial-tracking=()" always;
    try_files $uri =404;
  }

  # Everything else (index.html, the widget's index.html, sw.js, config.json)
  # keeps its name across deploys. Without Cache-Control, browsers guess a
  # freshness lifetime from Last-Modified and keep a stale index.html until a
  # hard reload. no-cache revalidates every time: a cheap 304 when unchanged.
  location / {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-pQY0fuQAnnVQH5nQfjo80rzGkQzeN3JeAtAJ+1KcD4k=' 'sha256-3042zLa3JXvrJe/2n8P/XpIKwqBdNTu7fwbLZUNrzZQ=' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://recaptcha.net/recaptcha/ https://js.hcaptcha.com/ https://newassets.hcaptcha.com/; style-src 'self' 'unsafe-inline'; img-src 'self' https: blob: data:; media-src 'self' https: blob: data:; font-src 'self' data:; connect-src 'self' https: wss: blob: data:; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' https:; manifest-src 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), browsing-topics=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), local-fonts=(), magnetometer=(), midi=(), payment=(), serial=(), usb=(), xr-spatial-tracking=()" always;

    rewrite ^/config.json$ /config.json break;
    rewrite ^/manifest.json$ /manifest.json break;

    rewrite ^/sw.js$ /sw.js break;
    rewrite ^/pdf.worker.min.js$ /pdf.worker.min.js break;

    rewrite ^/public/(.*)$ /public/$1 break;

    rewrite ^(.+)$ /index.html break;
  }
}
